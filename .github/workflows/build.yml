name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Build 3dsmaps.3dsx
        run: make
      - name: Get CIA tools
        run: |
          mkdir -p /tmp/tools && cd /tmp/tools
          curl -sSLf -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
          curl -sSLf -o bannertool.zip https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip
          unzip -q makerom.zip && unzip -q -j bannertool.zip linux-x86_64/bannertool
          chmod +x makerom bannertool
      - name: Build 3dsmaps.cia
        run: MAKEROM=/tmp/tools/makerom BANNERTOOL=/tmp/tools/bannertool ./tools/make_cia.sh
      - uses: actions/upload-artifact@v4
        with:
          name: 3dsmaps
          path: |
            3dsmaps.3dsx
            3dsmaps.cia

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jansson
        run: sudo apt-get update && sudo apt-get install -y libjansson-dev
      - name: Unit tests
        run: make -C tests

  # Pushing a tag like v1.0.0 publishes a release with the .cia and .3dsx.
  # The FBI QR code in the README points at the latest release's .cia.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: 3dsmaps
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            3dsmaps.cia
            3dsmaps.3dsx
